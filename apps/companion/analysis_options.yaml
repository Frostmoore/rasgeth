include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 100

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    curly_braces_in_flow_control_structures: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**
    - third_party/**

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
    unawaited_futures: true
    # Private fields set from public named parameters.
    prefer_initializing_formals: false
