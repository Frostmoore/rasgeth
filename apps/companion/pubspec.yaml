name: rgcompanion
description: "RGCompanion: the RedGiant app (Android, iOS, Windows, macOS, Linux)."
publish_to: 'none'
version: 0.1.0+1

environment:
  # The same Flutter as Rig and the CI (companion.yml): 3.47.3, Dart 3.13.3.
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  audioplayers: ^6.8.1
  bonsoir: ^7.1.6
  cryptography: ^2.9.0
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 22.x: compileSdk 36, which the project's AGP finds (23 asks for 37).
  flutter_local_notifications: ^22.3.3
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.4.0
  http: ^1.6.0
  intl: ^0.20.3
  markdown: ^7.3.1
  path_drawing: ^1.0.1
  path_provider: ^2.1.6
  pdfx: ^2.11.0
  pointycastle: ^4.0.0
  # 1.8.x: compileSdk 34 (1.9 asks for 37, see above).
  receive_sharing_intent: ">=1.8.1 <1.9.0"
  record: ^7.2.0
  shared_preferences: ^2.5.6
  unifiedpush: ">=6.1.0 <6.2.0"
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  desktop_drop: ^0.8.0
  # Pasted images and copied files (Ctrl/Cmd+V in the composer); pinned.
  pasteboard: 0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
