name: rgcompanion
description: "RGCompanion: the RedGiant app (Android, iOS, Windows, macOS, Linux)."
publish_to: 'none'
version: 0.1.0+1

environment:
  # The same Flutter as Rig and the CI (companion.yml): 3.47.3, Dart 3.13.3.
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  audioplayers: ^6.8.1
  bonsoir: ^7.1.6
  cryptography: ^2.9.0
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 22.x: compileSdk 36, which the project's AGP finds (23 asks for 37).
  flutter_local_notifications: ^22.3.3
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.4.0
  http: ^1.6.0
  # Photos for the model: redrawn with the long side at 2000 px as JPEG, as the page does.
  image: ^4.5.4
  intl: ^0.20.3
  markdown: ^7.3.1
  path_drawing: ^1.0.1
  path_provider: ^2.1.6
  pdfx: ^2.11.0
  pointycastle: ^4.0.0
  # 1.8.x: compileSdk 34 (1.9 asks for 37, see above).
  receive_sharing_intent: ">=1.8.1 <1.9.0"
  record: ^7.2.0
  shared_preferences: ^2.5.6
  unifiedpush: ">=6.1.0 <6.2.0"
  url_launcher: ^6.3.3
  # Pinned (BSD-3, flutter.dev): Android, iOS, macOS (WKWebView).
  webview_flutter: 4.14.1
  # The person's terminal (G42.5): the page's xterm.js drawn natively, pinned (MIT, TerminalStudio).
  xterm: 4.0.0
  # WebView2 on Windows, drawn into Flutter (composition), pinned (BSD-3, tomars.tech).
  webview_flutter_windows: 1.3.1
  # WebKitGTK on Linux (G42.0), drawn over the Flutter view and clipped to its place: a copy of
  # webview_all_linux 1.5.1 (MIT) whose TLS errors carry the certificate (third_party/, see its
  # pubspec), on webview_all's own platform interface (MIT), pinned.
  webview_all_linux:
    path: third_party/webview_all_linux
  webview_platform_interface: 1.5.1
  desktop_drop: ^0.8.0
  # Pasted images and copied files (Ctrl/Cmd+V in the composer); pinned.
  pasteboard: 0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # G42.9: the fake server reads automations' YAML as the real one does (already in the lock).
  yaml: ^3.1.0

flutter:
  generate: true
  uses-material-design: true
