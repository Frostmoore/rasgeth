name: RGCompanion

# The Flutter app (apps/companion, G40.6): analysis, tests and a build for each of the five
# systems, as artifacts (unsigned: signing comes with G40.13). It runs on its own, only when the
# app or this file changes, so it never slows the main CI down. Work-in-progress branches
# (wip/...) start nothing.
# G40.12: ci.yml (a version branch) and release.yml (when it builds the installers itself) call it
# with `desktop: true`: only the Windows, macOS and Linux builds, whose artifacts the installers
# carry (packaging/windows app\, RedGiant.app's Helpers) and the release attaches (Linux's tar).
on:
  push:
    branches: ["p[0-9]*", "a[0-9]*", "b[0-9]*", "main"]
    paths: ["apps/companion/**", "packaging/linux-app/**", ".github/workflows/companion.yml"]
  pull_request:
    paths: ["apps/companion/**", "packaging/linux-app/**", ".github/workflows/companion.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      desktop:
        description: "Only the computers' builds (no checks, Android or iOS): the installers' app"
        type: boolean
        default: false

concurrency:
  # Called by ci.yml or release.yml it runs inside their run: a group of its own, so it never
  # cancels (or is cancelled by) this workflow's own run of the same push.
  group: companion-${{ inputs.desktop && 'desktop' || 'all' }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The same Flutter as Rig and the local checks (pubspec: Dart ^3.13).
  FLUTTER_VERSION: "3.47.3"

defaults:
  run:
    working-directory: apps/companion

jobs:
  check:
    if: ${{ !inputs.desktop }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      # The translations are generated from the ARB files and kept in git: they must match.
      - name: Translations up to date
        run: git diff --exit-code -- lib/l10n
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      # Goldens are drawn on Linux (test/goldens): this job is their reference.
      - run: flutter test

  android:
    needs: check
    if: ${{ !inputs.desktop }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: rgcompanion-android-debug-apk
          path: apps/companion/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  linux:
    needs: check
    if: ${{ !cancelled() && (needs.check.result == 'success' || needs.check.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Desktop build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libwebkit2gtk-4.1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build linux --release
      # The bundle with its menu entry and a per-user installer (packaging/linux-app, G40.12).
      - run: |
          stage=rgcompanion-linux-x64
          mkdir -p "$stage"
          cp -R build/linux/x64/release/bundle "$stage/bundle"
          cp ../../packaging/linux-app/install-app.sh ../../packaging/linux-app/rgcompanion.desktop "$stage/"
          cp ../../packages/web/public/icon-512.png "$stage/rgcompanion.png"
          tar -czf rgcompanion-linux-x64.tar.gz "$stage"
      - uses: actions/upload-artifact@v4
        with:
          name: rgcompanion-linux-x64
          path: apps/companion/rgcompanion-linux-x64.tar.gz
          retention-days: 14

  windows:
    needs: check
    if: ${{ !cancelled() && (needs.check.result == 'success' || needs.check.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: rgcompanion-windows-x64
          path: apps/companion/build/windows/x64/runner/Release/
          retention-days: 14

  macos:
    needs: check
    if: ${{ !cancelled() && (needs.check.result == 'success' || needs.check.result == 'skipped') }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Signed to run locally only (ad hoc); notarization comes with G40.13.
      - run: flutter build macos --release
      - run: ditto -c -k --keepParent build/macos/Build/Products/Release/RGCompanion.app rgcompanion-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rgcompanion-macos
          path: apps/companion/rgcompanion-macos.zip
          retention-days: 14

  ios:
    needs: check
    if: ${{ !inputs.desktop }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Without signing: proves it builds; TestFlight comes with G40.13.
      - run: flutter build ios --release --no-codesign
      - run: ditto -c -k --keepParent build/ios/iphoneos/Runner.app rgcompanion-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rgcompanion-ios-unsigned
          path: apps/companion/rgcompanion-ios-unsigned.zip
          retention-days: 14
