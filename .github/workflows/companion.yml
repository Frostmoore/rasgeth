name: Rasgeth App

# The Flutter app (apps/companion, G40.6): analysis, tests and a build for each of the five
# systems, as artifacts (unsigned: signing comes with G40.13). It runs on its own, only when the
# app or this file changes, so it never slows the main CI down. Work-in-progress branches
# (wip/...) start nothing.
# G40.12: ci.yml (a version branch) and release.yml (when it builds the installers itself) call it
# with `desktop: true`: only the Windows, macOS and Linux builds, whose artifacts the installers
# carry (packaging/windows app\, Rasgeth.app's Helpers) and the release attaches (Linux's tar).
# Artifacts (plan 3.9.0, N5; ci.yml and release.yml download them by these names):
# rasgeth-app-windows-x64, rasgeth-app-linux-x64 (rasgeth-app-linux-x64.tar.gz), rasgeth-app-macos
# (rasgeth-app-macos.zip), rasgeth-android-debug-apk, rasgeth-ios-unsigned.
on:
  push:
    branches: ["p[0-9]*", "a[0-9]*", "b[0-9]*", "main"]
    paths: ["apps/companion/**", "packaging/linux-app/**", ".github/workflows/companion.yml"]
  pull_request:
    paths: ["apps/companion/**", "packaging/linux-app/**", ".github/workflows/companion.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      desktop:
        description: "Only the computers' builds (no checks, Android or iOS): the installers' app"
        type: boolean
        default: false

concurrency:
  # Called by ci.yml or release.yml it runs inside their run: a group of its own, so it never
  # cancels (or is cancelled by) this workflow's own run of the same push.
  group: companion-${{ inputs.desktop && 'desktop' || 'all' }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The same Flutter as Rig and the local checks (pubspec: Dart ^3.13).
  FLUTTER_VERSION: "3.47.3"

defaults:
  run:
    working-directory: apps/companion

jobs:
  # Incremental (own pushes only, never when ci.yml or release.yml call this file): when an earlier
  # run of this workflow on this branch built the five apps, and only test files changed since its
  # commit (scripts/ci-reuse-source.sh, scripts/ci-test-only.mjs), `check` (analysis and tests)
  # still runs but the builds are not repeated: their artifacts stay that run's (named in this
  # run's summary). The release does not use these artifacts (ci.yml's `companion` job, desktop,
  # builds the ones it carries), so nothing published depends on this reuse.
  plan:
    if: ${{ !inputs.desktop }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: .
    outputs:
      reuse_run: ${{ steps.plan.outputs.reuse_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts
      - id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWN: ${{ github.event_name == 'push' && github.workflow == 'Rasgeth App' && !inputs.desktop }}
        run: |
          set -uo pipefail
          reuse_run="" reuse_sha=""
          if [ "$OWN" = true ]; then
            found=$(scripts/ci-reuse-source.sh companion.yml "$GITHUB_REF_NAME" "android,linux,windows,macos,ios" \
              "rasgeth-android-debug-apk,rasgeth-app-linux-x64,rasgeth-app-windows-x64,rasgeth-app-macos,rasgeth-ios-unsigned" 2>"$RUNNER_TEMP/reuse.log") || found=""
            cat "$RUNNER_TEMP/reuse.log"
            if [ -n "$found" ]; then
              reuse_run=${found%% *}; reuse_sha=${found#* }
              msg="the five apps' builds (Android, iOS, Linux, Windows, macOS) are reused from run $reuse_run (sha ${reuse_sha:0:7}): only tests changed since; analysis and tests run here"
              echo "::notice title=Builds reused::$msg"
              echo "Reused from run $reuse_run (sha ${reuse_sha:0:7}): $msg" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "reuse_run=$reuse_run" >> "$GITHUB_OUTPUT"

  check:
    if: ${{ !inputs.desktop }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      # The translations are generated from the ARB files and kept in git: they must match.
      - name: Translations up to date
        run: git diff --exit-code -- lib/l10n
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      # Goldens are drawn on Linux (test/goldens): this job is their reference.
      - run: flutter test

  android:
    needs: [plan, check]
    if: ${{ !inputs.desktop && needs.plan.outputs.reuse_run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Gradle fetches its plugins from Maven Central and Google: when one of them answers «Could
      # not find/resolve» (3.9.5: kotlin-gradle-plugin 2.2.21 missing for a minute) the build is
      # tried again, up to three times. A build that fails for any other reason fails at once.
      - name: flutter build apk --debug (again on Gradle's download errors only)
        shell: bash
        run: |
          for try in 1 2 3; do
            if flutter build apk --debug 2>&1 | tee "$RUNNER_TEMP/apk.log"; [ "${PIPESTATUS[0]}" = 0 ]; then exit 0; fi
            grep -qE "Could not (resolve|find|GET|HEAD|download)|Read timed out|Connection reset|Remote host terminated|status code 5[0-9][0-9]|Received status code 429" "$RUNNER_TEMP/apk.log" || exit 1
            [ "$try" = 3 ] && exit 1
            echo "::warning title=Gradle::a download failed (try $try of 3): again in $((30 * try)) s"
            sleep $((30 * try))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rasgeth-android-debug-apk
          path: apps/companion/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
        id: upload_95
        continue-on-error: true
      - name: "upload artifact: a pause before the second try"
        if: ${{ steps.upload_95.outcome == 'failure' }}
        shell: bash
        run: sleep 30
      - name: "upload artifact (second try)"
        if: ${{ steps.upload_95.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: rasgeth-android-debug-apk
          path: apps/companion/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  linux:
    needs: [plan, check]
    if: ${{ !cancelled() && needs.plan.outputs.reuse_run == '' && (needs.check.result == 'success' || needs.check.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Desktop build tools
        run: |
          sudo apt-get -o Acquire::Retries=4 update
          sudo apt-get -o Acquire::Retries=4 install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The app's version (G41.8b: the app on its own compares it with the newest release): the
      # release's, from packaging/release-kind.json (the tag's when a release is built).
      - name: Version
        shell: bash
        run: echo "RG_APP_VERSION=$(node -p "require('../../packaging/release-kind.json').version")" >> "$GITHUB_ENV"
      - run: flutter build linux --release --dart-define=RG_APP_VERSION=${{ env.RG_APP_VERSION }}
      # The bundle with its menu entry and a per-user installer (packaging/linux-app, G40.12).
      - run: |
          stage=rasgeth-app-linux-x64
          mkdir -p "$stage"
          cp -R build/linux/x64/release/bundle "$stage/bundle"
          cp ../../packaging/linux-app/install-app.sh ../../packaging/linux-app/rasgeth-app.desktop "$stage/"
          cp ../../packages/web/public/icon-512.png "$stage/rasgeth-app.png"
          tar -czf rasgeth-app-linux-x64.tar.gz "$stage"
      - uses: actions/upload-artifact@v4
        with:
          name: rasgeth-app-linux-x64
          path: apps/companion/rasgeth-app-linux-x64.tar.gz
          retention-days: 14
        id: upload_131
        continue-on-error: true
      - name: "upload artifact: a pause before the second try"
        if: ${{ steps.upload_131.outcome == 'failure' }}
        shell: bash
        run: sleep 30
      - name: "upload artifact (second try)"
        if: ${{ steps.upload_131.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: rasgeth-app-linux-x64
          path: apps/companion/rasgeth-app-linux-x64.tar.gz
          retention-days: 14

  windows:
    needs: [plan, check]
    if: ${{ !cancelled() && needs.plan.outputs.reuse_run == '' && (needs.check.result == 'success' || needs.check.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The app's version (G41.8b: the app on its own compares it with the newest release): the
      # release's, from packaging/release-kind.json (the tag's when a release is built).
      - name: Version
        shell: bash
        run: echo "RG_APP_VERSION=$(node -p "require('../../packaging/release-kind.json').version")" >> "$GITHUB_ENV"
      - run: flutter build windows --release --dart-define=RG_APP_VERSION=${{ env.RG_APP_VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: rasgeth-app-windows-x64
          path: apps/companion/build/windows/x64/runner/Release/
          retention-days: 14
        id: upload_155
        continue-on-error: true
      - name: "upload artifact: a pause before the second try"
        if: ${{ steps.upload_155.outcome == 'failure' }}
        shell: bash
        run: sleep 30
      - name: "upload artifact (second try)"
        if: ${{ steps.upload_155.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: rasgeth-app-windows-x64
          path: apps/companion/build/windows/x64/runner/Release/
          retention-days: 14

  macos:
    needs: [plan, check]
    if: ${{ !cancelled() && needs.plan.outputs.reuse_run == '' && (needs.check.result == 'success' || needs.check.result == 'skipped') }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Signed to run locally only (ad hoc); notarization comes with G40.13.
      # The app's version (G41.8b: the app on its own compares it with the newest release): the
      # release's, from packaging/release-kind.json (the tag's when a release is built).
      - name: Version
        shell: bash
        run: echo "RG_APP_VERSION=$(node -p "require('../../packaging/release-kind.json').version")" >> "$GITHUB_ENV"
      - run: flutter build macos --release --dart-define=RG_APP_VERSION=${{ env.RG_APP_VERSION }}
      # The bundle is named by macos/Runner/Configs/AppInfo.xcconfig (`Rasgeth App.app`): the one
      # .app the build makes, whatever its name.
      - run: |
          app=$(ls -d build/macos/Build/Products/Release/*.app)
          [ "$(printf '%s\n' "$app" | wc -l)" -eq 1 ] || { echo "not one .app: $app"; exit 1; }
          ditto -c -k --keepParent "$app" rasgeth-app-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rasgeth-app-macos
          path: apps/companion/rasgeth-app-macos.zip
          retention-days: 14
        id: upload_186
        continue-on-error: true
      - name: "upload artifact: a pause before the second try"
        if: ${{ steps.upload_186.outcome == 'failure' }}
        shell: bash
        run: sleep 30
      - name: "upload artifact (second try)"
        if: ${{ steps.upload_186.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: rasgeth-app-macos
          path: apps/companion/rasgeth-app-macos.zip
          retention-days: 14

  ios:
    needs: [plan, check]
    if: ${{ !inputs.desktop && needs.plan.outputs.reuse_run == '' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Without signing: proves it builds; TestFlight comes with G40.13.
      - run: flutter build ios --release --no-codesign
      - run: ditto -c -k --keepParent build/ios/iphoneos/Runner.app rasgeth-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rasgeth-ios-unsigned
          path: apps/companion/rasgeth-ios-unsigned.zip
          retention-days: 14
        id: upload_207
        continue-on-error: true
      - name: "upload artifact: a pause before the second try"
        if: ${{ steps.upload_207.outcome == 'failure' }}
        shell: bash
        run: sleep 30
      - name: "upload artifact (second try)"
        if: ${{ steps.upload_207.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: rasgeth-ios-unsigned
          path: apps/companion/rasgeth-ios-unsigned.zip
          retention-days: 14
