# The Mac app signed and notarized, as a release would make it, but published nowhere: the .dmg
# stays as this run's download for a few days (2026-11-05). Started by hand from Actions, or by a
# change to the Mac app's files.
name: Mac app (signed)

on:
  workflow_dispatch:
  # Also when the Mac app's own files change (a hand-started workflow must be on main first). Not
  # on tags, main or version branches (3.5.9): there CI's mac-app makes the same app, notarized,
  # and a tag's macOS runners belong to the release.
  push:
    branches-ignore:
      - main
      - "p[0-9]+.[0-9]+.[0-9]+"
      - "a[0-9]+.[0-9]+.[0-9]+"
      - "b[0-9]+.[0-9]+.[0-9]+"
    paths:
      - "packaging/mac/**"
      - ".github/workflows/mac-app.yml"

permissions:
  contents: read

# pnpm's own retries for the registry (3.9.6): a slow minute of npm's registry is waited out
# instead of failing the install; a lockfile that does not match still fails at once.
env:
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_mintimeout: "10000"
  npm_config_fetch_retry_maxtimeout: "120000"
  pnpm_config_fetch_retries: "5"

jobs:
  mac-app:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile && pnpm build
      - name: The certificate, in a keychain of this run only
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_NOTARY_KEY: ${{ secrets.MAC_NOTARY_KEY }}
        run: bash packaging/mac/keychain.sh
      - name: Build, sign, notarize
        env:
          MAC_NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID }}
          MAC_NOTARY_ISSUER_ID: ${{ secrets.MAC_NOTARY_ISSUER_ID }}
        run: bash packaging/mac/build.sh "0.0.0-$(git rev-parse --short HEAD)"
      - name: What Gatekeeper says
        run: |
          xcrun stapler validate packaging/mac/dist/Rasgeth-mac-*.dmg || true
          spctl -a -vvv -t install packaging/mac/dist/Rasgeth-mac-*.dmg || true
          hdiutil attach packaging/mac/dist/Rasgeth-mac-*.dmg -mountpoint /tmp/rg-dmg -nobrowse -quiet
          spctl -a -vvv /tmp/rg-dmg/Rasgeth.app || true
          codesign -dv --verbose=2 /tmp/rg-dmg/Rasgeth.app 2>&1 | grep -E "Authority|TeamIdentifier|Runtime" || true
          hdiutil detach /tmp/rg-dmg -quiet
      - uses: actions/upload-artifact@v4
        with:
          name: Rasgeth-mac-signed
          path: packaging/mac/dist/Rasgeth-mac-*.dmg
          retention-days: 7
        id: upload_62
        continue-on-error: true
      - name: "upload artifact: a pause before the second try"
        if: ${{ steps.upload_62.outcome == 'failure' }}
        shell: bash
        run: sleep 30
      - name: "upload artifact (second try)"
        if: ${{ steps.upload_62.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: Rasgeth-mac-signed
          path: packaging/mac/dist/Rasgeth-mac-*.dmg
          retention-days: 7
